---
all:
  children:
    servers:
      hosts:
        tec-rigs:
          ansible_host: 165.232.97.80
        techost:
          ansible_host: techost.nottinghamtec.co.uk
          # Keep the kernel default this host was already running with.
          swap_swappiness: 60
          ufw_extra_rules:
            # mosh-server binds a port in this range per session.
            - { port: "60000:61000", proto: udp, comment: mosh }
    # Hosts that run PyRIGS and its supporting stack.
    rigs:
      hosts:
        tec-rigs:
    # Hosts that run BookStack with distrust (Discourse OIDC).
    bookstack:
      hosts:
        techost:
    # Hosts that run the nginx reverse proxy for their containers.
    ingress:
      hosts:
        techost:
