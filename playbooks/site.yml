---
- name: Configure common server baseline
  hosts: servers
  become: true
  roles:
    - role: users
      tags: [users]
    - role: ssh
      tags: [ssh]
    - role: ufw
      tags: [ufw]
    - role: unattended_upgrades
      tags: [unattended_upgrades]
    - role: debug_utils
      tags: [debug_utils]
    - role: swap
      tags: [swap]
    - role: docker
      tags: [docker]
    - role: crowdsec
      tags: [crowdsec]

- name: Configure PyRIGS stack
  hosts: rigs
  become: true
  roles:
    - role: postgres
      tags: [postgres]
    - role: pyrigs
      tags: [pyrigs]
    - role: nginx
      tags: [nginx, certbot]
    - role: certbot
      tags: [certbot]
  tasks:
    - name: Integrate CrowdSec with nginx
      ansible.builtin.import_role:
        name: crowdsec
        tasks_from: nginx.yml
      when: crowdsec_nginx_mode == 'host'
      tags: [crowdsec]

- name: Configure BookStack and distrust
  hosts: bookstack
  become: true
  roles:
    - role: bookstack
      tags: [bookstack]

- name: Configure the reverse proxy
  hosts: ingress
  become: true
  pre_tasks:
    - name: Build the OpenResty image with the CrowdSec bouncer
      ansible.builtin.import_role:
        name: crowdsec
        tasks_from: nginx_docker_image.yml
      when: crowdsec_nginx_mode == 'docker'
      tags: [crowdsec, ingress]
  roles:
    - role: ingress
      tags: [ingress]
  tasks:
    - name: Integrate CrowdSec with nginx
      ansible.builtin.import_role:
        name: crowdsec
        tasks_from: nginx.yml
      when: crowdsec_nginx_mode == 'docker'
      tags: [crowdsec]
