---
- name: Configure common server baseline
  hosts: servers
  become: true
  roles:
    - role: users
      tags: [users]
    - role: ssh
      tags: [ssh]
    - role: fail2ban
      tags: [fail2ban]
    - role: unattended_upgrades
      tags: [unattended_upgrades]
    - role: debug_utils
      tags: [debug_utils]
    - role: swap
      tags: [swap]
    - role: docker
      tags: [docker]

- name: Configure PyRIGS stack
  hosts: rigs
  become: true
  roles:
    - role: postgres
      tags: [postgres]
    - role: pyrigs
      tags: [pyrigs]
    - role: nginx
      tags: [nginx, certbot]
    - role: certbot
      tags: [certbot]

- name: Configure BookStack and distrust
  hosts: bookstack
  become: true
  roles:
    - role: bookstack
      tags: [bookstack]

- name: Configure the reverse proxy
  hosts: ingress
  become: true
  roles:
    - role: ingress
      tags: [ingress]
