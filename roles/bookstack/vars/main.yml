---
# Passwords and the OIDC client secret are injected from the compose .env file instead, to keep them out of compose.yml.
bookstack_base_env:
  PUID: "911"
  PGID: "911"
  TZ: "{{ bookstack_timezone }}"
  APP_URL: "https://{{ bookstack_hostname }}"
  # Only the reverse proxy (on the shared docker network) can reach BookStack, so trust its forwarded headers.
  APP_PROXIES: "*"
  DB_HOST: "{{ bookstack_db_host }}"
  DB_PORT: "3306"
  DB_DATABASE: "{{ bookstack_db_name }}"
  DB_USERNAME: "{{ bookstack_db_user }}"
  AUTH_METHOD: oidc
  STORAGE_IMAGE_TYPE: "{{ bookstack_image_storage }}"
  AUTH_AUTO_INITIATE: "{{ bookstack_auto_initiate | bool | lower }}"
  OIDC_NAME: "{{ bookstack_oidc_name }}"
  OIDC_DISPLAY_NAME_CLAIMS: name
  OIDC_CLIENT_ID: "{{ bookstack_oidc_client_id }}"
  OIDC_ISSUER: "https://{{ bookstack_distrust_hostname }}/oauth2"
  OIDC_ISSUER_DISCOVER: "true"
  # Users are matched by this claim (the Discourse user id), so changing a forum email does not create a new account.
  OIDC_EXTERNAL_ID_CLAIM: sub
  # Roles follow the user's Discourse groups on every login.
  OIDC_USER_TO_GROUPS: "true"
  OIDC_GROUPS_CLAIM: groups
  OIDC_REMOVE_FROM_GROUPS: "true"
# BookStack settings kept in its database (Settings > Customization), checked and applied by the role.
bookstack_accent_rgb: "{{ [bookstack_accent_color[1:3], bookstack_accent_color[3:5], bookstack_accent_color[5:7]] | map('int', 0, 16) | join(',') }}"
bookstack_accent_rgb_dark: >-
  {{ [bookstack_accent_color_dark[1:3], bookstack_accent_color_dark[3:5], bookstack_accent_color_dark[5:7]]
     | map('int', 0, 16) | join(',') }}
bookstack_db_settings:
  app-name: "{{ bookstack_app_name }}"
  app-homepage-type: "{{ bookstack_homepage }}"
  lists-page-count-books: "{{ bookstack_books_per_page }}"
  app-color: "{{ bookstack_accent_color }}"
  app-color-light: "rgba({{ bookstack_accent_rgb }},0.15)"
  app-color-dark: "{{ bookstack_accent_color_dark }}"
  app-color-light-dark: "rgba({{ bookstack_accent_rgb_dark }},0.15)"
bookstack_mail_env:
  MAIL_DRIVER: smtp
  MAIL_HOST: "{{ bookstack_mail_host }}"
  MAIL_PORT: "{{ bookstack_mail_port }}"
  MAIL_USERNAME: "{{ bookstack_mail_username }}"
  MAIL_ENCRYPTION: "{{ bookstack_mail_encryption }}"
  MAIL_FROM: "{{ bookstack_mail_from }}"
  MAIL_FROM_NAME: "{{ bookstack_mail_from_name }}"
bookstack_env: >-
  {{ bookstack_base_env
     | combine(bookstack_mail_env if bookstack_mail_host | length > 0 else {})
     | combine(bookstack_extra_env) }}
