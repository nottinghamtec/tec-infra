---
- name: Remove fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: absent
    purge: true

- name: Remove the fail2ban jails and filters this project added
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/fail2ban/jail.d/sshd.local
    - /etc/fail2ban/jail.d/nginx-scanner.local
    - /etc/fail2ban/filter.d/nginx-scanner.conf
