---
- name: Find the proxy network gateway
  ansible.builtin.include_tasks: docker_gateway.yml

- name: Create the CrowdSec directories in the ingress project
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ crowdsec_ingress_dir }}"
    - "{{ crowdsec_ingress_dir }}/conf.d"
    - "{{ crowdsec_ingress_dir }}/crowdsec"
    - "{{ crowdsec_ingress_dir }}/openresty"

- name: Write the OpenResty Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ crowdsec_ingress_dir }}/openresty/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: crowdsec_dockerfile

- name: Build the OpenResty image with the CrowdSec bouncer
  community.docker.docker_image:
    name: "{{ crowdsec_openresty_image.split(':') | first }}"
    tag: "{{ crowdsec_openresty_image.split(':') | last }}"
    source: build
    build:
      path: "{{ crowdsec_ingress_dir }}/openresty"
      pull: true
    force_source: "{{ crowdsec_dockerfile is changed }}"
    state: present

- name: Write the bouncer configuration
  ansible.builtin.template:
    src: bouncer.conf.j2
    dest: "{{ crowdsec_ingress_dir }}/crowdsec/crowdsec-openresty-bouncer.conf"
    owner: root
    group: root
    mode: "0600"
  vars:
    crowdsec_bouncer_key: "{{ crowdsec_nginx_bouncer_key }}"
  no_log: true
  notify: Restart ingress nginx
