---
- name: Make sure the proxy network exists
  community.docker.docker_network:
    name: "{{ crowdsec_docker_network }}"
    state: present

- name: Look up the proxy network
  community.docker.docker_network_info:
    name: "{{ crowdsec_docker_network }}"
  register: crowdsec_proxy_network

- name: Record the proxy network gateway
  ansible.builtin.set_fact:
    crowdsec_docker_gateway: >-
      {{ ((crowdsec_proxy_network.network.IPAM.Config | default([])) | selectattr('Gateway', 'defined')
          | map(attribute='Gateway') | list | first) | default('172.17.0.1') }}
