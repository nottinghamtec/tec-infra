---
postgres_packages:
  - postgresql
  - postgresql-client
  - python3-psycopg2

# Login roles to create. Passwords should come from vaulted variables.
#   - name: app
#     password: "{{ vault_postgres_app_password }}"
postgres_roles: []

# Databases to create, with the role that owns each.
#   - name: app
#     owner: app
postgres_databases: []

# Allow password (scram) logins over the local unix socket, which the default
# pg_hba.conf only permits via peer authentication.
#   - database: app
#     user: app
postgres_local_socket_access: []

# Settings written to a conf.d drop-in. Defaults suit a small host that also runs the app and nginx.
# JIT compilation costs more than it saves on short OLTP queries, so it is off.
postgres_settings:
  jit: "off"
  shared_buffers: 512MB
  effective_cache_size: 2GB
  work_mem: 8MB
  random_page_cost: "1.1"
  shared_preload_libraries: pg_stat_statements
  pg_stat_statements.track: all

# Extensions created in every database in postgres_databases. pg_stat_statements needs the preload setting above
# (a restart, done when the settings file changes) and then shows the slowest queries in the pg_stat_statements view.
postgres_extensions:
  - pg_stat_statements
