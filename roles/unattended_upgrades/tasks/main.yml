---
- name: Ensure unattended-upgrades is installed
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    cache_valid_time: 3600

- name: Configure unattended-upgrades overrides
  ansible.builtin.template:
    src: 52unattended-upgrades-ansible.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-ansible
    owner: root
    group: root
    mode: "0644"

- name: Create the apt-daily-upgrade.timer override directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Schedule the daily upgrade run
  ansible.builtin.template:
    src: apt-daily-upgrade-timer.conf.j2
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
