---
- name: Check the container environment is complete
  ansible.builtin.assert:
    that:
      - pyrigs_required_env is subset(pyrigs_merged_env.keys() | list)
      - pyrigs_merged_env.values() | select('equalto', 'CHANGEME') | list | length == 0
    fail_msg: >-
      pyrigs_env / pyrigs_secret_env must define {{ pyrigs_required_env | join(', ') }}
      and no value may be the CHANGEME placeholder.
    quiet: true
  vars:
    pyrigs_merged_env: "{{ pyrigs_env | combine(pyrigs_secret_env) }}"
    pyrigs_required_env:
      - SECRET_KEY
      - DATABASE_PASSWORD
      - EMAIL_HOST
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_FROM
  no_log: true

- name: Create the environment directory
  ansible.builtin.file:
    path: "{{ pyrigs_env_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the container environment file
  ansible.builtin.template:
    src: pyrigs.env.j2
    dest: "{{ pyrigs_env_dir }}/pyrigs.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Create the project and static files directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ pyrigs_project_dir }}"
    - "{{ pyrigs_static_root }}/static"

- name: Write the deploy script configuration
  ansible.builtin.template:
    src: deploy.conf.j2
    dest: "{{ pyrigs_env_dir }}/deploy.conf"
    owner: root
    group: root
    mode: "0644"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ pyrigs_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Record the initial image tag
  ansible.builtin.copy:
    content: "PYRIGS_TAG={{ pyrigs_default_tag }}\n"
    dest: "{{ pyrigs_project_dir }}/deploy.env"
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Install the deploy script
  ansible.builtin.copy:
    src: pyrigs-deploy
    dest: /usr/local/sbin/pyrigs-deploy
    owner: root
    group: root
    mode: "0750"

- name: Deploy PyRIGS
  ansible.builtin.command: /usr/local/sbin/pyrigs-deploy
  register: pyrigs_deploy
  changed_when: "'PYRIGS_CHANGED=true' in pyrigs_deploy.stdout"

- name: Create the deploy user
  ansible.builtin.user:
    name: "{{ pyrigs_deploy_user }}"
    system: true
    shell: /bin/sh
    password_lock: true
    create_home: true
    state: present
  register: pyrigs_deploy_user_result
  when: pyrigs_deploy_ssh_keys | length > 0

- name: Authorise the deploy keys, restricted to the deploy script
  ansible.posix.authorized_key:
    user: "{{ pyrigs_deploy_user }}"
    key: "{{ pyrigs_deploy_ssh_keys | join('\n') }}"
    key_options: 'command="sudo /usr/local/sbin/pyrigs-deploy \"$SSH_ORIGINAL_COMMAND\"",restrict'
    exclusive: true
    state: present
  when:
    - pyrigs_deploy_ssh_keys | length > 0
    - not (ansible_check_mode and pyrigs_deploy_user_result is changed)

- name: Allow the deploy user to run only the deploy script as root
  ansible.builtin.copy:
    content: "{{ pyrigs_deploy_user }} ALL=(root) NOPASSWD: /usr/local/sbin/pyrigs-deploy\n"
    dest: /etc/sudoers.d/90-pyrigs-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: pyrigs_deploy_ssh_keys | length > 0

- name: Install cron
  ansible.builtin.apt:
    name: cron
    state: present
    cache_valid_time: 3600
  register: pyrigs_cron_install

- name: Schedule PyRIGS tasks
  ansible.builtin.cron:
    name: "{{ item.name }}"
    cron_file: pyrigs
    user: root
    minute: "{{ item.minute }}"
    hour: "{{ item.hour }}"
    job: >-
      docker exec {{ pyrigs_container_name }} sh -c '{{ item.command }}' 2>&1
      | logger -t {{ item.tag }}
    state: "{{ item.state | default('present') }}"
  loop: "{{ pyrigs_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
