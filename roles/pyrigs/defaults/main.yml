---
pyrigs_image_repository: ghcr.io/nottinghamtec/pyrigs
# Tag deployed the first time only. After that the deployed tag is recorded in
# <project dir>/deploy.env and changed with `pyrigs-deploy <tag>`.
pyrigs_default_tag: latest
pyrigs_project_dir: /opt/pyrigs
pyrigs_container_name: pyrigs

# The container's port is published on the host at this address; keep it on
# loopback and let nginx proxy to it.
pyrigs_bind_address: 127.0.0.1
pyrigs_port: 8000
pyrigs_container_port: 8000
pyrigs_workers: 3
# Threads per worker, so a request blocked on SMTP or an outbound fetch doesn't stall a whole worker. Needs a PyRIGS
# image with PyRIGS.pdf.render_rml: without its lock, concurrent PDF renders in one process fail with a font KeyError.
pyrigs_threads: 4
pyrigs_timeout: 60
# Recycle workers periodically to cap memory growth; the jitter staggers the restarts.
pyrigs_max_requests: 1000
pyrigs_max_requests_jitter: 100

# PostgreSQL's unix socket directory, mounted into the container so the app can
# reach the host database without it listening on any network.
pyrigs_postgres_socket_dir: /var/run/postgresql

# Environment for the container. Put plain settings in pyrigs_env and anything
# sensitive in pyrigs_secret_env (sourced from the vault). Do not copy Heroku-only
# variables such as DATABASE_URL or PORT.
pyrigs_env: {}
pyrigs_secret_env: {}

# Run `manage.py migrate` every time the container starts, before gunicorn.
pyrigs_run_migrations: true

pyrigs_env_dir: /etc/pyrigs

# Public keys allowed to trigger deployments over SSH as pyrigs_deploy_user. Each
# key can only run `pyrigs-deploy <tag>`. Leave empty to not create the user.
pyrigs_deploy_user: deploy
pyrigs_deploy_ssh_keys: []

# Collected static files are copied out of the image to <root>/static, which
# nginx serves directly (falling back to the app, which can also serve them).
pyrigs_static_root: /var/www/pyrigs

# Scheduled tasks, run with `docker exec` inside the container and written to
# /etc/cron.d/pyrigs. Times are server time (UTC). Output goes to the journal:
# journalctl -t <tag>. Set state: absent on an entry to remove it.
pyrigs_cron_jobs:
  - name: pyrigs cleanup
    tag: pyrigs-cleanup
    minute: "0"
    hour: "0"
    command: python manage.py cleanupregistration && python manage.py usercleanup && python manage.py clearsessions
  - name: pyrigs reminders
    tag: pyrigs-reminders
    minute: "0"
    hour: "8"
    command: python manage.py send_reminders
  - name: pyrigs badges
    tag: pyrigs-badges
    minute: "0"
    hour: "7-23"
    command: python manage.py award_badges --quiet

# After a deploy the new container must answer this path (sent with the Host and X-Forwarded-Proto the proxy would
# add) or the deploy rolls back.
pyrigs_smoke_path: /user/login/
pyrigs_smoke_host: "{{ (pyrigs_env.DJANGO_ALLOWED_HOSTS | default('localhost')).split(',')[0] | trim }}"

# Housekeeping, run weekly: keep this many of the newest image tags (plus the deployed one and any in use), and
# remove static files not used by a deploy in the last pyrigs_static_retention_days days.
pyrigs_keep_images: 5
pyrigs_static_retention_days: 30
