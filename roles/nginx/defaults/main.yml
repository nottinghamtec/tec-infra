---
# Directory served for ACME HTTP-01 challenges (shared with certbot).
nginx_acme_webroot: /var/www/certbot

# Sites to serve. Each entry:
#   - name: rigs                      # config file and certificate name
#     server_names: [example.org]
#     upstream: http://127.0.0.1:8080 # optional, proxied when set (else 404)
#     static_root: /var/www/app       # optional, serves <root>/static/ at /static/
#     auth_paths: [user/login]        # optional, POSTs to these paths are rate limited per address
# A site gets HTTPS once /etc/letsencrypt/live/<name>/ exists.
nginx_sites: []

# fail2ban bans addresses that repeatedly request WordPress or PHP paths that 404 (this host runs no PHP).
nginx_scanner_maxretry: 5
nginx_scanner_findtime: 10m
nginx_scanner_bantime: 1d
