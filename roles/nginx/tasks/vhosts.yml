---
- name: Check for site certificates
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"
  loop: "{{ nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  register: nginx_cert_stats

- name: Write site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/conf.d/{{ item.item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nginx_cert_stats.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  vars:
    nginx_has_cert: "{{ item.stat.exists }}"
  register: nginx_site_files

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  when: nginx_site_files is changed  # noqa: no-handler

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when: nginx_site_files is changed  # noqa: no-handler
