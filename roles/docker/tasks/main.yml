---
- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    cache_valid_time: 3600

- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    state: present
  register: docker_repo

- name: Update apt cache after adding the repository
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo is changed  # noqa: no-handler

# In check mode the repository isn't written, so the packages can't resolve.
- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
  when: not (ansible_check_mode and docker_repo is changed)

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: not (ansible_check_mode and docker_repo is changed)

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: not (ansible_check_mode and docker_repo is changed)
